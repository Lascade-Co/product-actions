name: Daily Org Catchup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only: no email, no commit to the catchup archive"
        type: boolean
        default: false
      to:
        description: "Send a [TEST] email only to this address (no commit to the archive)"
        type: string
        default: ""
      recovery:
        description: "Production resend after a missed morning email; must run from main"
        type: boolean
        default: false
  schedule:
    # GitHub delays scheduled runs by hours, so fire three times the evening before;
    # the gate jobs hold each run until 05:45 America/Los_Angeles (DST-aware) and the
    # later runs exit at dedupe once the email is out. Off-the-hour minutes on purpose.
    - cron: '17 3 * * *'
    - cron: '17 6 * * *'
    - cron: '17 9 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-catchup-${{ github.event_name }}
  cancel-in-progress: false

env:
  PYTHONPATH: scripts/common:scripts/ai:scripts/catchup

defaults:
  run:
    shell: "seal-bash-e {0}"

jobs:
  settings:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.settings.outputs.mode }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      # Reads the event file, so a test address is masked before any later step could print it.
      - name: Mask test recipient
        run: |
          python3 - <<'PY'
          import json, os, re
          to = (json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}).get("to") or ""
          # Mask every address on its own line; workflow commands cannot carry a raw CR or LF.
          for part in {to.strip(), *(p.strip() for p in re.split(r"[,;\r\n]+", to))}:
              if part and "\n" not in part and "\r" not in part:
                  print("::add-mask::" + part.replace("%", "%25"))
          PY
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/common
            scripts/catchup
      - id: settings
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RECOVERY: ${{ inputs.recovery }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/catchup/catchup_settings.py settings
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  # Hold until 05:45 Pacific. Two chained jobs because one job is capped at 6h.
  gate:
    needs: settings
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      report_date: ${{ steps.gate.outputs.report_date }}
      remaining: ${{ steps.gate.outputs.remaining }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/common
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/common/gate.py --phase 1 --event "${{ github.event_name }}" --tz America/Los_Angeles --target 05:45 --workflow daily-catchup.yml --sent-step "Deliver catchup for "
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  gate2:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      report_date: ${{ steps.gate.outputs.report_date }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/common
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/common/gate.py --phase 2 --event "${{ github.event_name }}" --tz America/Los_Angeles --target 05:45 --workflow daily-catchup.yml --sent-step "Deliver catchup for " \
            --report-date "${{ needs.gate.outputs.report_date }}" \
            --remaining "${{ needs.gate.outputs.remaining }}"
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  discover:
    needs: gate2
    if: needs.gate2.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      matrix: ${{ steps.disc.outputs.matrix }}
      has_repos: ${{ steps.disc.outputs.has_repos }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/catchup

      - name: Mint org-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Lascade-Co

      - name: Discover repos active in the last 24h
        id: disc
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/catchup/catchup_discover.py --hours 24
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  summarize:
    needs: discover
    if: needs.discover.outputs.has_repos == 'true'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/catchup
            data
            .github/actions/fetch-ai

      - name: Extract owner/repo
        id: repo
        run: |
          FULL="${{ matrix.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"
          echo "safe=${FULL//\//__}" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: ./.github/actions/fetch-ai

      - name: Summarise repo activity with Claude
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 scripts/catchup/catchup_repo.py \
            --repo "${{ matrix.repo }}" \
            --classify-prompt data/CATCHUP_CLASSIFY.md \
            --summary-prompt data/CATCHUP_SUMMARY.md \
            --out "summary-${{ steps.repo.outputs.safe }}.json"

      - name: Seal repo summary artifact
        id: pack_1
        run: seal-pack "summary-${{ steps.repo.outputs.safe }}" "summary-${{ steps.repo.outputs.safe }}.json"

      - name: Upload repo summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: summary-${{ steps.repo.outputs.safe }}
          path: ${{ runner.temp }}/seal/art/summary-${{ steps.repo.outputs.safe }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  # Merge every per-repo summary into ONE daily file and hand it off as an
  # artifact. No catchup checkout here: committing and emailing run in parallel
  # downstream, each consuming this artifact.
  collect:
    needs: [discover, summarize]
    if: ${{ always() && needs.discover.outputs.has_repos == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      today: ${{ steps.merge.outputs.today }}
      wrote: ${{ steps.merge.outputs.wrote }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/catchup

      - name: Download all repo summaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: summary-*
          merge-multiple: true

      - name: Unseal repo summaries
        if: hashFiles('artifacts/*.tgz.age') != ''
        run: seal-unpack artifacts
        env:
          REPO_AGE_KEY: ${{ secrets.REPO_AGE_KEY }}

      - name: Merge summaries into the daily file
        id: merge
        run: |
          TODAY="$(date -u +%F)"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          python3 scripts/catchup/catchup_collect.py \
            --artifacts-dir artifacts \
            --date "$TODAY" \
            --daily-out daily.json

      - name: Seal merged daily report
        id: pack_2
        if: steps.merge.outputs.wrote == 'true'
        run: seal-pack daily-report daily.json

      - name: Upload merged daily report
        if: steps.merge.outputs.wrote == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-report
          path: ${{ runner.temp }}/seal/art/daily-report/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  # Publish the merged daily file to Lascade-Co/catchup (placing the file +
  # updating the running index) through the CI App token. Runs in parallel with `email`.
  commit:
    needs: [settings, collect]
    # Only a real run writes the archive; a dry run or a test send never touches it.
    if: needs.collect.outputs.wrote == 'true' && needs.settings.outputs.mode == 'real'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/catchup

      - name: Mint GitHub App token (catchup repo)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Lascade-Co
          repositories: catchup

      - name: Checkout catchup repo
        uses: actions/checkout@v7
        with:
          repository: Lascade-Co/catchup
          token: ${{ steps.app-token.outputs.token }}
          path: catchup

      - name: Download merged daily report
        uses: actions/download-artifact@v8
        with:
          name: daily-report
          path: sealed-in/daily-report

      - name: Unseal merged daily report
        run: seal-unpack sealed-in/daily-report .
        env:
          REPO_AGE_KEY: ${{ secrets.REPO_AGE_KEY }}

      - name: Place daily file and update index
        run: |
          python3 scripts/catchup/catchup_collect.py \
            --daily daily.json \
            --date "${{ needs.collect.outputs.today }}" \
            --out-dir catchup

      - name: Commit and push to catchup
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TODAY: ${{ needs.collect.outputs.today }}
        run: |
          cd catchup
          git config user.name "lascade-ci[bot]"
          git config user.email "lascade-ci[bot]@users.noreply.github.com"
          git add "daily/${TODAY}.json" index.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Daily catchup: ${TODAY}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Lascade-Co/catchup.git" HEAD:main
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  # Build the rich HTML report (Claude prose + deterministic render) for all
  # active repos except those in data/catchup_exclude.txt, and email it through
  # Resend right after the build (no hold). Runs in parallel with `commit`; an
  # email failure can't block the commit.
  email:
    needs: [settings, gate2, collect]
    if: needs.collect.outputs.wrote == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      REPORT_DATE: ${{ needs.gate2.outputs.report_date }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      # Reads the event file, so a test address is masked before any later step could print it.
      - name: Mask test recipient
        run: |
          python3 - <<'PY'
          import json, os, re
          to = (json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}).get("to") or ""
          # Mask every address on its own line; workflow commands cannot carry a raw CR or LF.
          for part in {to.strip(), *(p.strip() for p in re.split(r"[,;\r\n]+", to))}:
              if part and "\n" not in part and "\r" not in part:
                  print("::add-mask::" + part.replace("%", "%25"))
          PY
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/common
            scripts/catchup
            data
            .github/actions/fetch-ai

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: ./.github/actions/fetch-ai

      - name: Install delivery dependencies
        run: pip install --quiet requests==2.34.2

      - name: Download merged daily report
        uses: actions/download-artifact@v8
        with:
          name: daily-report
          path: sealed-in/daily-report

      - name: Unseal merged daily report
        run: seal-unpack sealed-in/daily-report .
        env:
          REPO_AGE_KEY: ${{ secrets.REPO_AGE_KEY }}

      - name: Generate report JSON
        id: report
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          python3 scripts/catchup/catchup_report.py \
            --daily daily.json \
            --report-prompt data/CATCHUP_REPORT.md \
            --exclude data/catchup_exclude.txt \
            --icons data/catchup_icons.json \
            --people data/catchup_people.json \
            --out report.json

      - name: Render email HTML
        if: steps.report.outputs.send == 'true'
        env:
          TODAY: ${{ needs.collect.outputs.today }}
        run: |
          python3 scripts/catchup/catchup_render_email.py --report report.json \
            --org-label Lascade --hours 24 --people data/catchup_people.json \
            --today "$TODAY" --subject-out email.subject \
            --out email.html

      # A dry run packs the rendered email as a sealed preview; nothing is sent.
      - name: Dry run catchup for ${{ needs.gate2.outputs.report_date }}
        id: pack_3
        if: steps.report.outputs.send == 'true' && needs.settings.outputs.mode == 'dry'
        run: seal-pack preview-catchup email.html email.subject

      - name: Upload catchup preview
        if: steps.report.outputs.send == 'true' && needs.settings.outputs.mode == 'dry'
        uses: actions/upload-artifact@v7
        with:
          name: preview-catchup
          path: ${{ runner.temp }}/seal/art/preview-catchup/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # A test send goes to that one address only, with a [TEST] subject, a run-id
      # suffix and a key of its own: a real send's key (daily-report-<date>) must
      # stay free for the morning's email.
      - name: Test send catchup for ${{ needs.gate2.outputs.report_date }}
        if: steps.report.outputs.send == 'true' && needs.settings.outputs.mode == 'test'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          TEST_TO=$(jq -r '.inputs.to // ""' "$GITHUB_EVENT_PATH")
          test -n "$TEST_TO"
          python3 scripts/catchup/catchup_send.py --report-date "$REPORT_DATE" \
            --html email.html --subject email.subject --to "$TEST_TO"

      - name: Check catchup was not already delivered
        id: dedupe
        if: steps.report.outputs.send == 'true' && needs.settings.outputs.mode == 'real'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: >-
          python3 scripts/catchup/catchup_settings.py dedupe --workflow daily-catchup.yml
          --sent-step "Deliver catchup for " --report-date "$REPORT_DATE"

      - name: Deliver catchup for ${{ needs.gate2.outputs.report_date }}
        if: steps.report.outputs.send == 'true' && needs.settings.outputs.mode == 'real' && steps.dedupe.outputs.sent != 'True'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: >-
          python3 scripts/catchup/catchup_send.py --report-date "$REPORT_DATE"
          --html email.html --subject email.subject
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1
