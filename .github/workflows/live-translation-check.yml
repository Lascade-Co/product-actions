name: Check feedback translation services

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: "seal-bash-e {0}"

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts/common:scripts/reviews:scripts/survey
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install translation dependencies
        run: pip install --quiet requests==2.34.2 google-auth==2.63.0
      - name: Check fixed translation cases
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python3 scripts/reviews/live_translation_check.py
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1
