name: Daily Ad Spend

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the emails and keep them as a sealed preview, without sending
        type: boolean
        default: false
      variants:
        description: Variants to build and send (B, with installs and CPI, is retired)
        default: 'A'
      to:
        description: Send a test only to these recipients, comma-separated (blank sends to the scheduled list and needs recovery)
        default: ''
      recovery:
        description: Production resend after a missed morning email; must run from main
        type: boolean
        default: false
      reconcile:
        description: Compare channel totals with marketing-net (prints match or MISMATCH only)
        type: boolean
        default: false
      break_commentary:
        description: Test only, disable AI commentary to exercise the report fallback
        type: boolean
        default: false
  schedule:
    # GitHub delays scheduled runs by hours, so fire three times the evening before;
    # the gates hold each run until 05:45 America/Los_Angeles and later runs exit at dedupe.
    - cron: '29 3 * * *'
    - cron: '29 6 * * *'
    - cron: '29 9 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-ad-spend-${{ github.event_name }}
  cancel-in-progress: false

env:
  PYTHONPATH: scripts/common:scripts/ai:scripts/adspend:scripts/pnl:scripts/catchup

defaults:
  run:
    shell: "seal-bash-e {0}"

jobs:
  settings:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.settings.outputs.mode }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      # Reads the event file, so a test address is masked before any later step could print it.
      - name: Mask test recipient
        run: |
          python3 - <<'PY'
          import json, os, re
          to = (json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}).get("to") or ""
          # Mask every address on its own line; workflow commands cannot carry a raw CR or LF.
          for part in {to.strip(), *(p.strip() for p in re.split(r"[,;\r\n]+", to))}:
              if part and "\n" not in part and "\r" not in part:
                  print("::add-mask::" + part.replace("%", "%25"))
          PY
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/common
            scripts/catchup
      - id: settings
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RECOVERY: ${{ inputs.recovery }}
          DRY_RUN: ${{ inputs.dry_run }}
          VARIANTS: ${{ inputs.variants || 'A' }}
        run: python3 scripts/catchup/catchup_settings.py settings --variants "$VARIANTS"
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  gate:
    needs: settings
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      report_date: ${{ steps.gate.outputs.report_date }}
      remaining: ${{ steps.gate.outputs.remaining }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/common
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/common/gate.py --phase 1 --event "${{ github.event_name }}" --tz America/Los_Angeles --target 05:45 --workflow daily-ad-spend.yml --sent-step "Delivered ad spend for "
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  gate2:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      report_date: ${{ steps.gate.outputs.report_date }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/common
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/common/gate.py --phase 2 --event "${{ github.event_name }}" --tz America/Los_Angeles --target 05:45 --workflow daily-ad-spend.yml --sent-step "Delivered ad spend for " \
            --report-date "${{ needs.gate.outputs.report_date }}" \
            --remaining "${{ needs.gate.outputs.remaining }}"
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  # Builds the emails and sends right after the build (no hold).
  email:
    needs: [settings, gate2]
    if: needs.gate2.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VARIANTS: ${{ inputs.variants || 'A' }}
      REPORT_DATE: ${{ needs.gate2.outputs.report_date }}
      # Scheduled sends go to everyone below (its sha1 is part of the Resend key, keep it byte-identical).
      # A test send reads the `to` input from the event file and passes it with --mail-to.
      MAIL_TO: 'cherian@lascade.com, Jishnu M M <jishnu@lascade.com>'
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      # Reads the event file, so a test address is masked before any later step could print it.
      - name: Mask test recipient
        run: |
          python3 - <<'PY'
          import json, os, re
          to = (json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}).get("to") or ""
          # Mask every address on its own line; workflow commands cannot carry a raw CR or LF.
          for part in {to.strip(), *(p.strip() for p in re.split(r"[,;\r\n]+", to))}:
              if part and "\n" not in part and "\r" not in part:
                  print("::add-mask::" + part.replace("%", "%25"))
          PY
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/common
            scripts/catchup
            scripts/adspend
            scripts/pnl
            data
            .github/actions/fetch-ai
      - name: Work out the ad date
        id: dates
        run: echo "ad_date=$(date -d '${{ needs.gate2.outputs.report_date }} - 1 day' +%F)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --quiet requests==2.34.2 pyjwt==2.13.0 cryptography==50.0.0

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: pnl
          env-slug: prod
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /
          export-type: env

      - uses: ./.github/actions/fetch-ai
        continue-on-error: true

      - name: Build the emails
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python3 scripts/adspend/adspend_main.py --ad-date "${{ steps.dates.outputs.ad_date }}" --variants "$VARIANTS" --out out --scratch scratch ${{ inputs.reconcile && '--reconcile' || '' }} ${{ inputs.break_commentary && '--break-commentary' || '' }}

      # ---- variant A ----
      - name: Dry run ad spend A for ${{ needs.gate2.outputs.report_date }}
        id: pack_A
        if: ${{ needs.settings.outputs.mode == 'dry' && contains(env.VARIANTS, 'A') }}
        run: seal-pack preview-ad-spend-A out/email-A.html out/email-A.txt out/email-A.subject

      - name: Upload ad spend A preview
        if: ${{ needs.settings.outputs.mode == 'dry' && contains(env.VARIANTS, 'A') }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-ad-spend-A
          path: ${{ runner.temp }}/seal/art/preview-ad-spend-A/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Test send ad spend A for ${{ needs.gate2.outputs.report_date }}
        if: ${{ !cancelled() && needs.settings.outputs.mode == 'test' && contains(env.VARIANTS, 'A') }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          TEST_TO=$(jq -r '.inputs.to // ""' "$GITHUB_EVENT_PATH")
          test -n "$TEST_TO"
          python3 scripts/adspend/adspend_send.py --variant A --ad-date "${{ steps.dates.outputs.ad_date }}" --mail-to "$TEST_TO"

      - name: Check ad spend A was not already delivered
        id: dedupeA
        if: ${{ !cancelled() && needs.settings.outputs.mode == 'real' && contains(env.VARIANTS, 'A') }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: >-
          python3 scripts/catchup/catchup_settings.py dedupe --workflow daily-ad-spend.yml
          --sent-step "Deliver ad spend A for " --report-date "$REPORT_DATE"

      # No continue-on-error: a failed step must not read as delivered to the gate.
      # Variant B runs even after A failed; the job still ends red.
      - name: Deliver ad spend A for ${{ needs.gate2.outputs.report_date }}
        if: ${{ !cancelled() && needs.settings.outputs.mode == 'real' && contains(env.VARIANTS, 'A') && steps.dedupeA.outcome == 'success' && steps.dedupeA.outputs.sent != 'True' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/adspend/adspend_send.py --variant A --ad-date "${{ steps.dates.outputs.ad_date }}"

      # ---- variant B ----
      - name: Dry run ad spend B for ${{ needs.gate2.outputs.report_date }}
        id: pack_B
        if: ${{ needs.settings.outputs.mode == 'dry' && contains(env.VARIANTS, 'B') }}
        run: seal-pack preview-ad-spend-B out/email-B.html out/email-B.txt out/email-B.subject

      - name: Upload ad spend B preview
        if: ${{ needs.settings.outputs.mode == 'dry' && contains(env.VARIANTS, 'B') }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-ad-spend-B
          path: ${{ runner.temp }}/seal/art/preview-ad-spend-B/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Test send ad spend B for ${{ needs.gate2.outputs.report_date }}
        if: ${{ !cancelled() && needs.settings.outputs.mode == 'test' && contains(env.VARIANTS, 'B') }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          TEST_TO=$(jq -r '.inputs.to // ""' "$GITHUB_EVENT_PATH")
          test -n "$TEST_TO"
          python3 scripts/adspend/adspend_send.py --variant B --ad-date "${{ steps.dates.outputs.ad_date }}" --mail-to "$TEST_TO"

      - name: Check ad spend B was not already delivered
        id: dedupeB
        if: ${{ !cancelled() && needs.settings.outputs.mode == 'real' && contains(env.VARIANTS, 'B') }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: >-
          python3 scripts/catchup/catchup_settings.py dedupe --workflow daily-ad-spend.yml
          --sent-step "Deliver ad spend B for " --report-date "$REPORT_DATE"

      # No continue-on-error: a failed step must not read as delivered to the gate.
      # Variant B runs even after A failed; the job still ends red.
      - name: Deliver ad spend B for ${{ needs.gate2.outputs.report_date }}
        if: ${{ !cancelled() && needs.settings.outputs.mode == 'real' && contains(env.VARIANTS, 'B') && steps.dedupeB.outcome == 'success' && steps.dedupeB.outputs.sent != 'True' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/adspend/adspend_send.py --variant B --ad-date "${{ steps.dates.outputs.ad_date }}"
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  # The gate dedupes on this step: it succeeds only when every selected variant was
  # accepted (or was already delivered by an earlier run).
  delivered:
    name: Delivered ad spend for ${{ needs.gate2.outputs.report_date }}
    needs: [settings, gate2, email]
    if: ${{ needs.settings.outputs.mode == 'real' && needs.email.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Delivered ad spend for ${{ needs.gate2.outputs.report_date }}
        run: echo "all selected variants delivered"
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1
