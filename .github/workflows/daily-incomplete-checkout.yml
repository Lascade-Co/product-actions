name: Daily Incomplete Checkout Outreach

on:
  schedule:
    # 10:00 IST = 04:30 UTC
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build sealed preview without sending
        type: boolean
        default: false
      report_date:
        description: YYYY-MM-DD; blank uses today IST
        type: string
        default: ''
      since:
        description: Override window start (YYYY-MM-DD) for backfills
        type: string
        default: ''
      to:
        description: Send a TEST email only to this address
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: digest-incomplete-checkout
  cancel-in-progress: false

defaults:
  run:
    shell: "seal-bash-e {0}"

jobs:
  outreach:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      PYTHONPATH: scripts/common:scripts/incomplete_checkout
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            data
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --quiet requests==2.34.2
      # The test recipient is read from the event file inside the sealed shell, never expanded into the public step header.
      - name: Send incomplete checkout outreach
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPORT_DATE: ${{ inputs.report_date }}
          SINCE: ${{ inputs.since }}
        run: |
          FLAGS=()
          [ "$DRY_RUN" = "true" ] && FLAGS+=(--dry-run)
          [ -n "$REPORT_DATE" ] && FLAGS+=(--report-date "$REPORT_DATE")
          [ -n "$SINCE" ] && FLAGS+=(--since "$SINCE")
          TEST_TO=$(jq -r '.inputs.to // ""' "$GITHUB_EVENT_PATH")
          [ -n "$TEST_TO" ] && FLAGS+=(--to "$TEST_TO")
          python3 scripts/incomplete_checkout/ic_main.py "${FLAGS[@]}"
      - name: Pack sealed preview
        if: ${{ inputs.dry_run }}
        run: seal-pack preview-incomplete-checkout-ist out
      - name: Upload preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-incomplete-checkout-ist
          path: ${{ runner.temp }}/seal/art/preview-incomplete-checkout-ist/
          if-no-files-found: error
          retention-days: 3
      - name: Deliver incomplete checkout IST for ${{ inputs.report_date || 'today' }}
        if: ${{ !inputs.dry_run }}
        run: echo "Outreach emails sent"
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1
